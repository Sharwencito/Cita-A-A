<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Aún quieres tener esa cita conmigo?</title>
  
  <style>
    @font-face {
      font-family: 'Scripter';
      src: url('Scripter-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'Scripter', cursive, sans-serif;
    }

    /* Fondo general con el patrón sutil fuera del marco */
    body {
      background-color: #FF5252;
      background-image: url('patron-rosas.png');
      background-repeat: repeat;
      background-size: 250px 250px;
      background-blend-mode: soft-light;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Contenedor principal por encima de las imágenes flotantes */
    .container {
      border: 8px dashed #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 35px 20px;
      text-align: center;
      position: relative;
      background-color: #FF5252;
      border-radius: 12px;
      z-index: 10; /* Se mantiene por encima de la decoración flotante */
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .filete-decorativo {
      width: 320px;
      max-width: 85%;
      margin-bottom: 12px;
    }
    h1 {
      color: #ffffff;
      font-size: 2.5rem;
      text-transform: uppercase;
      margin: 10px 0 30px 0;
      line-height: 1.3;
      letter-spacing: 1px;
    }
    .content-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      min-height: 320px;
      gap: 15px;
    }
    .btn-placeholder {
      width: 26%;
      min-height: 140px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    .heart-wrapper {
      position: relative;
      width: 48%;
      max-width: 380px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-svg {
      position: absolute;
      width: 112%;
      height: 112%;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .main-illustration {
      position: relative;
      z-index: 2;
      width: 88%;
      height: auto;
      object-fit: contain;
      margin-top: -5px;
      transform: translateX(-8px);
    }

    .btn-option {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      font-size: 1.1rem;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1.25;
      padding: 0;
    }
    .btn-option img {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 4px solid #A8C3B1;
      object-fit: cover;
      margin-top: 12px;
      transition: transform 0.2s;
    }
    .btn-option:hover img {
      transform: scale(1.08);
    }
    #btnNo {
      transition: top 0.2s ease, left 0.2s ease;
      z-index: 99;
    }
    .btn-container-si {
      width: 26%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .hidden { display: none !important; }

    /* Animación de flotación suave infinita */
    @keyframes floatAnimation {
      0% {
        transform: translateY(0px) var(--rotacion);
      }
      50% {
        transform: translateY(-15px) var(--rotacion);
      }
      100% {
        transform: translateY(0px) var(--rotacion);
      }
    }

    /* Estilos base para las 13 ilustraciones flotantes */
    .floating-img {
      position: absolute;
      z-index: 1; /* Al fondo, detrás de la caja principal */
      width: 90px;
      height: 90px;
      object-fit: contain;
      animation: floatAnimation 4s ease-in-out infinite;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
      pointer-events: none; /* Evita que estorben los clics */
    }

    /* Distribución periférica de las 13 imágenes alrededor de la pantalla */
    .img-0  { top: 4%;   left: 2%;   --rotacion: rotate(-12deg); animation-delay: 0s; }
    .img-1  { top: 2%;   left: 22%;  --rotacion: rotate(8deg);   animation-delay: 0.5s; }
    .img-2  { top: 3%;   right: 22%; --rotacion: rotate(-6deg);  animation-delay: 1s; }
    .img-3  { top: 4%;   right: 2%;  --rotacion: rotate(14deg);  animation-delay: 1.5s; }
    
    .img-4  { top: 28%;  left: 1%;   --rotacion: rotate(10deg);  animation-delay: 0.3s; }
    .img-5  { top: 28%;  right: 1%;  --rotacion: rotate(-8deg);  animation-delay: 1.2s; }
    
    .img-6  { top: 55%;  left: 1.5%; --rotacion: rotate(-14deg); animation-delay: 0.7s; }
    .img-7  { top: 55%;  right: 1.5%;--rotacion: rotate(12deg);  animation-delay: 1.8s; }
    
    .img-8  { bottom: 20%; left: 2%;  --rotacion: rotate(6deg);   animation-delay: 0.2s; }
    .img-9  { bottom: 20%; right: 2%; --rotacion: rotate(-10deg); animation-delay: 1.4s; }
    
    .img-10 { bottom: 2%;  left: 5%;  --rotacion: rotate(-8deg);  animation-delay: 0.9s; }
    .img-11 { bottom: 2%;  left: 42%; --rotacion: rotate(5deg);   animation-delay: 1.6s; }
    .img-12 { bottom: 2%;  right: 5%; --rotacion: rotate(11deg);  animation-delay: 0.4s; }

    /* Formulario */
    .form-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 380px;
      margin: 0 auto;
      color: white;
    }
    .form-group {
      width: 100%;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 1.2rem;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    .submit-btn {
      background-color: #ffffff;
      color: #FF5252;
      border: none;
      padding: 14px 28px;
      font-size: 1.3rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      transition: transform 0.2s, background-color 0.2s;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .submit-btn:hover {
      transform: scale(1.04);
      background-color: #fff0f0;
    }

    @media (max-width: 1100px) {
      .floating-img {
        width: 65px;
        height: 65px;
      }
    }

    @media (max-width: 650px) {
      .content-grid {
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }
      .heart-wrapper {
        width: 80%;
        order: 1;
      }
      .btn-container-si {
        width: 100%;
        order: 2;
      }
      .btn-placeholder {
        width: 100%;
        order: 3;
      }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- 13 ILUSTRACIONES FLOTANTES ALREDEDOR DEL FONDO -->
  <img src="amore.png"   class="floating-img img-0"  alt="Ilustración 0">
  <img src="amore1.png"  class="floating-img img-1"  alt="Ilustración 1">
  <img src="amore2.png"  class="floating-img img-2"  alt="Ilustración 2">
  <img src="amore3.png"  class="floating-img img-3"  alt="Ilustración 3">
  <img src="amore4.png"  class="floating-img img-4"  alt="Ilustración 4">
  <img src="amore5.png"  class="floating-img img-5"  alt="Ilustración 5">
  <img src="amore6.png"  class="floating-img img-6"  alt="Ilustración 6">
  <img src="amore7.png"  class="floating-img img-7"  alt="Ilustración 7">
  <img src="amore8.png"  class="floating-img img-8"  alt="Ilustración 8">
  <img src="amore9.png"  class="floating-img img-9"  alt="Ilustración 9">
  <img src="amore10.png" class="floating-img img-10" alt="Ilustración 10">
  <img src="amore11.png" class="floating-img img-11" alt="Ilustración 11">
  <img src="amore12.png" class="floating-img img-12" alt="Ilustración 12">

  <div class="container">
    
    <div id="step1">
      <img src="filete.png?v=2" alt="Decoración" class="filete-decorativo">
      
      <h1>PERICOTITA DE MI VIDA,<br>¿AÚN QUIERES TENER ESA CITA CONMIGO?</h1>

      <div class="content-grid">
        <div class="btn-placeholder">
          <button id="btnNo" class="btn-option" onmouseover="moverBoton()" onclick="moverBoton()">
            <span>NO, TE ODIO</span>
            <img src="gatollorando.jpg" alt="No">
          </button>
        </div>

        <div class="heart-wrapper">
          <svg class="heart-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 50,90 C 20,65 0,45 0,25 C 0,10 12,0 27,0 C 37,0 45,6 50,15 C 55,6 63,0 73,0 C 88,0 100,10 100,25 C 100,45 80,65 50,90 Z" fill="#ffffff"/>
          </svg>
          <img src="Amore sin fondo.png" alt="Nosotros" class="main-illustration">
        </div>

        <div class="btn-container-si">
          <button id="btnSi" class="btn-option" onclick="aceptarCita()">
            <span>SI, OBVIO, TE AMO, ERES LO MEJOR DE MI VIDA, CÁSEMONOS</span>
            <img src="gatito.gif" alt="Sí">
          </button>
        </div>
      </div>
    </div>

    <div id="step2" class="hidden">
      <img src="filete.png?v=2" alt="Decoración" class="filete-decorativo">
      <h1>¡SABÍA QUE DIRÍAS QUE SÍ! 💕🎉</h1>
      
      <form class="form-card" action="https://formspree.io/f/TU_ENDPOINT_DE_FORMSPREE" method="POST">
        <div class="form-group">
          <label for="fecha">¿Qué día quieres nuestra cita?</label>
          <input type="date" id="fecha" name="fecha_de_cita" required>
        </div>

        <div class="form-group">
          <label for="email">Escribe tu correo electrónico:</label>
          <input type="email" id="email" name="email_novia" placeholder="tu-correo@email.com" required>
        </div>

        <button type="submit" class="submit-btn">¡Agendar y enviar confirmación! ❤️</button>
      </form>
    </div>

  </div>

  <script>
    function moverBoton() {
      const btn = document.getElementById("btnNo");
      const x = Math.random() * (window.innerWidth - 160);
      const y = Math.random() * (window.innerHeight - 100);
      btn.style.position = "fixed";
      btn.style.left = `${Math.max(20, x)}px`;
      btn.style.top = `${Math.max(20, y)}px`;
      btn.style.width = "180px";
    }

    function aceptarCita() {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }
  </script>

</body>
</html>
