<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Aún quieres tener esa cita conmigo?</title>
  
  <style>
    @font-face {
      font-family: 'Scripter';
      src: url('Scripter-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'Scripter', cursive, sans-serif;
    }
    body {
      background-color: #FF5252;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      border: 8px dashed #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 35px 20px;
      text-align: center;
      position: relative;
      background-color: #FF5252;
      border-radius: 12px;
    }
    .filete-decorativo {
      width: 320px;
      max-width: 85%;
      margin-bottom: 12px;
    }
    h1 {
      color: #ffffff;
      font-size: 2.5rem;
      text-transform: uppercase;
      margin: 10px 0 30px 0;
      line-height: 1.3;
      letter-spacing: 1px;
    }
    .content-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      min-height: 320px;
      gap: 15px;
    }
    .btn-placeholder {
      width: 26%;
      min-height: 140px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    .heart-wrapper {
      position: relative;
      width: 48%;
      max-width: 380px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-svg {
      position: absolute;
      width: 112%;
      height: 112%;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Ajuste fino de la posición de la ilustración */
    .main-illustration {
      position: relative;
      z-index: 2;
      width: 88%;
      height: auto;
      object-fit: contain;
      margin-top: -5px;
      transform: translateX(-8px);
    }

    .btn-option {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      font-size: 1.1rem;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1.25;
      padding: 0;
    }
    .btn-option img {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 4px solid #A8C3B1;
      object-fit: cover;
      margin-top: 12px;
      transition: transform 0.2s;
    }
    .btn-option:hover img {
      transform: scale(1.08);
    }
    #btnNo {
      transition: top 0.2s ease, left 0.2s ease;
      z-index: 99;
    }
    .btn-container-si {
      width: 26%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .hidden { display: none !important; }

    .form-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 380px;
      margin: 0 auto;
      color: white;
    }
    .form-group {
      width: 100%;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 1.2rem;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    .submit-btn {
      background-color: #ffffff;
      color: #FF5252;
      border: none;
      padding: 14px 28px;
      font-size: 1.3rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      transition: transform 0.2s, background-color 0.2s;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .submit-btn:hover {
      transform: scale(1.04);
      background-color: #fff0f0;
    }

    @media (max-width: 650px) {
      .content-grid {
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }
      .heart-wrapper {
        width: 80%;
        order: 1;
      }
      .btn-container-si {
        width: 100%;
        order: 2;
      }
      .btn-placeholder {
        width: 100%;
        order: 3;
      }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="step1">
      <img src="filete.png?v=2" alt="Decoración" class="filete-decorativo">
      
      <h1>PERICOTITA DE MI VIDA,<br>¿AÚN QUIERES TENER ESA CITA CONMIGO?</h1>

      <div class="content-grid">
        <div class="btn-placeholder">
          <button id="btnNo" class="btn-option" onmouseover="moverBoton()" onclick="moverBoton()">
            <span>NO, TE ODIO</span>
            <img src="gatollorando.jpg" alt="No">
          </button>
        </div>

        <div class="heart-wrapper">
          <svg class="heart-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 50,90 C 20,65 0,45 0,25 C 0,10 12,0 27,0 C 37,0 45,6 50,15 C 55,6 63,0 73,0 C 88,0 100,10 100,25 C 100,45 80,65 50,90 Z" fill="#ffffff"/>
          </svg>
          <img src="Amore sin fondo.png" alt="Nosotros" class="main-illustration">
        </div>

        <div class="btn-container-si">
          <button id="btnSi" class="btn-option" onclick="aceptarCita()">
            <span>SI, OBVIO, TE AMO, ERES LO MEJOR DE MI VIDA, CÁSEMONOS</span>
            <img src="gatito.gif" alt="Sí">
          </button>
        </div>
      </div>
    </div>

    <div id="step2" class="hidden">
      <img src="filete.png?v=2" alt="Decoración" class="filete-decorativo">
      <h1>¡SABÍA QUE DIRÍAS QUE SÍ! 💕🎉</h1>
      
      <form class="form-card" action="https://formspree.io/f/TU_ENDPOINT_DE_FORMSPREE" method="POST">
        <div class="form-group">
          <label for="fecha">¿Qué día quieres nuestra cita?</label>
          <input type="date" id="fecha" name="fecha_de_cita" required>
        </div>

        <div class="form-group">
          <label for="email">Escribe tu correo electrónico:</label>
          <input type="email" id="email" name="email_novia" placeholder="tu-correo@email.com" required>
        </div>

        <button type="submit" class="submit-btn">¡Agendar y enviar confirmación! ❤️</button>
      </form>
    </div>

  </div>

  <script>
    function moverBoton() {
      const btn = document.getElementById("btnNo");
      const x = Math.random() * (window.innerWidth - 160);
      const y = Math.random() * (window.innerHeight - 100);
      btn.style.position = "fixed";
      btn.style.left = `${Math.max(20, x)}px`;
      btn.style.top = `${Math.max(20, y)}px`;
      btn.style.width = "180px";
    }

    function aceptarCita() {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }
  </script>

</body>
</html>
